# Two cells against the fixture corpus. Must complete in under 60 seconds.
# Consumed by Phase 6; present from Phase 0 so the config shape is fixed early.
name: smoke
_nohash: [description]
description: Minimal matrix used by CI and by `make verify-phase-6`.
corpora: [sample]
seed: 42
k: 10
matrix:
  chunker:
    - {name: fixed, params: {chunk_tokens: 512, overlap_tokens: 64}}
    - {name: markdown, params: {max_tokens: 768, prepend_heading_path: true}}
  embedder:
    - {name: bge-small, params: {}}
  retriever:
    - {name: dense, params: {}}
exclude: []
